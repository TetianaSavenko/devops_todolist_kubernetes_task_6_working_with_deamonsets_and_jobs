apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: todoapp-pinger
  namespace: mateapp
  labels:
    app: todoapp-pinger
spec:
  selector:
    matchLabels:
      app: todoapp-pinger
  template:
    metadata:
      labels:
        app: todoapp-pinger
    spec:
      containers:
      - name: curl-container
        image: radial/busyboxplus:curl

        command:
        - /bin/sh
        - -c
        - "while true; do curl -s http://todoapp; sleep 5; done"

        resources:
          requests:
            cpu: "10m"
            memory: "16Mi"
          limits:
            cpu: "50m"
            memory: "32Mi"